[project]
name = "sdk_rules"
version = "1"
description = "SDK Cliente para Cortex Rules con Pydantic v2"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "httpx-aws-auth>=4.1.1",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
