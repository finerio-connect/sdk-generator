[project]
name = "sdk-generator"
version = "0.1.0"
description = "SDK generator for Cortex services"
readme = "README.md"
authors = [
    { name = "carlos.santos", email = "carlos.santos@finerioconnect.com" },
]
requires-python = "<3.13,>=3.12.7"
dependencies = [
    "datamodel-code-generator[http]>=0.46.0",
    "rich>=14.2.0",
    "typer>=0.20.1",
]

[tool.uv.sources]

[dependency-groups]
dev = ["ruff<1.0.0,>=0.11.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdk_generator"]

[tool.pyright]
venvPath = "."
venv = ".venv"
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501"]

fixable = ["ALL"]
unfixable = []